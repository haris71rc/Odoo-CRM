name: odoocrm
description: Production-ready Flutter CRM powered by Odoo JSON-RPC.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0-276.0.dev

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.2
  go_router: ^15.1.2
  dio: ^5.8.0+1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1
  intl: ^0.20.2
  equatable: ^2.0.7
  flutter_html: ^3.0.0
  html: ^0.15.6
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  freezed: ^3.0.0
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
